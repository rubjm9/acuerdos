# =============================================================================
# Plataforma de Gobernanza — Actas, Acuerdos, Expedientes y Tareas
#
# Full self-hosted, EU-only stack. No content ever leaves this perimeter:
# all AI (extraction, embeddings, reranking, assistant) runs on the local
# vllm / tei services below.
#
# Profiles:
#   (default)   postgres, minio, web, worker        — core platform
#   ai          vllm, tei-embed, tei-rerank         — GPU node services
#   edge        caddy                               — TLS reverse proxy
#
# Local development without GPU: run the default profile only; the worker and
# search degrade gracefully (no rerank, deterministic-stub extraction).
#
# Puertos en el host: por defecto NO se publican (Coolify / proxy inverso
# enruta por la red Docker). Desarrollo local con npm/psql en el host:
#   docker compose -f docker-compose.yml -f docker-compose.host-ports.yml \
#     up -d postgres minio minio-init
# =============================================================================

name: acuerdos

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acuerdos}
      POSTGRES_USER: ${POSTGRES_USER:-acuerdos_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      APP_WEB_DB_PASSWORD: ${APP_WEB_DB_PASSWORD:?set in .env}
      APP_WORKER_DB_PASSWORD: ${APP_WORKER_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acuerdos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MINIO_REGION: eu-central-1
    volumes:
      - miniodata:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/actas &&
      mc mb --ignore-existing local/exports &&
      mc version enable local/actas &&
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acuerdos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_web:${APP_WEB_DB_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-acuerdos}
      DATABASE_URL_OWNER: postgres://${POSTGRES_USER:-acuerdos_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acuerdos}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-acuerdos_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_ACTAS: actas
      S3_BUCKET_EXPORTS: exports
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_ALLOWED_DOMAIN: ${AUTH_ALLOWED_DOMAIN:-bahai.es}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}
      WORKER_URL: http://worker:8000
      TEI_RERANK_URL: ${TEI_RERANK_URL:-http://tei-rerank:8080}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-plataforma@example.eu}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set in .env}
    # Coolify / Caddy enrutan a este puerto por la red Docker (sin bind al host).
    expose:
      - "3000"

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_worker:${APP_WORKER_DB_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-acuerdos}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-acuerdos_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_ACTAS: actas
      # Self-hosted AI endpoints ONLY. Leave empty in dev to use the stub
      # extractor; never point these at an external provider.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-mistral-small-3}
      TEI_EMBED_URL: ${TEI_EMBED_URL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    expose:
      - "8000"

  # ---------------------------------------------------------------------------
  # AI profile — deploy on the GPU node (24–48 GB VRAM). See docs/runbook.md.
  # ---------------------------------------------------------------------------
  vllm:
    profiles: ["ai"]
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: >
      --model mistralai/Mistral-Small-24B-Instruct-2501
      --served-model-name mistral-small-3
      --max-model-len 16384
      --gpu-memory-utilization 0.75
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8001:8000"

  tei-embed:
    profiles: ["ai"]
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    restart: unless-stopped
    command: --model-id BAAI/bge-m3 --max-batch-tokens 16384
    volumes:
      - hf-cache:/data
    ports:
      - "127.0.0.1:8002:80"

  tei-rerank:
    profiles: ["ai"]
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    restart: unless-stopped
    command: --model-id BAAI/bge-reranker-v2-m3 --max-batch-tokens 16384
    volumes:
      - hf-cache:/data
    ports:
      - "127.0.0.1:8003:80"

  # ---------------------------------------------------------------------------
  # Edge profile — TLS termination for production.
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["edge"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  miniodata:
  hf-cache:
  caddydata:
